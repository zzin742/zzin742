name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Roda todo dia as 18h UTC (15h em Brasilia)
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gera SVG 3D dos contribs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Deploy to output branch (coexiste com pacman)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: profile-3d-contrib
          destination_dir: profile-3d-contrib
          keep_files: true
          commit_message: "chore: update 3d contrib graphs"
