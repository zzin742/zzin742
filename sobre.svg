<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="869" height="253" viewBox="0 0 869 253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#0a0e14"/></linearGradient></defs><rect width="869" height="253" rx="12" fill="url(#bg)"/><rect x="0.5" y="0.5" width="868" height="252" rx="12" fill="none" stroke="#1f6feb" stroke-opacity="0.55"/><line x1="0" y1="30" x2="869" y2="30" stroke="#1f6feb" stroke-opacity="0.35"/><circle cx="22" cy="15.0" r="5" fill="#ff5f56"/><circle cx="38" cy="15.0" r="5" fill="#ffbd2e"/><circle cx="54" cy="15.0" r="5" fill="#27c93f"/><text x="434.5" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">jose@jztech: ~$ cat sobre.txt</text><clipPath id="s0"><rect x="22" y="54" height="25" width="0"><animate attributeName="width" from="0" to="825" begin="0.00s" dur="0.30s" fill="freeze"/></rect></clipPath><g clip-path="url(#s0)"><text xml:space="preserve" x="22" y="72.0" font-size="14" fill="#e6edf3">Sou desenvolvedor full stack e responsável pelo TI de uma empresa. Estudo Análise e</text></g><clipPath id="s1"><rect x="22" y="79" height="25" width="0"><animate attributeName="width" from="0" to="825" begin="0.30s" dur="0.30s" fill="freeze"/></rect></clipPath><g clip-path="url(#s1)"><text xml:space="preserve" x="22" y="97.0" font-size="14" fill="#e6edf3">Desenvolvimento de Sistemas na UniFAAT, no segundo ano.</text></g><clipPath id="s3"><rect x="22" y="129" height="25" width="0"><animate attributeName="width" from="0" to="825" begin="0.60s" dur="0.30s" fill="freeze"/></rect></clipPath><g clip-path="url(#s3)"><text xml:space="preserve" x="22" y="147.0" font-size="14" fill="#e6edf3">Também construo fora do trabalho: loja com pagamento, app de finanças, página de casal e</text></g><clipPath id="s4"><rect x="22" y="154" height="25" width="0"><animate attributeName="width" from="0" to="825" begin="0.90s" dur="0.30s" fill="freeze"/></rect></clipPath><g clip-path="url(#s4)"><text xml:space="preserve" x="22" y="172.0" font-size="14" fill="#e6edf3">assistente de voz. Em cada um faço a interface, o banco e o deploy, e entrego no ar.</text></g><clipPath id="s6"><rect x="22" y="204" height="25" width="0"><animate attributeName="width" from="0" to="825" begin="1.20s" dur="0.30s" fill="freeze"/></rect></clipPath><g clip-path="url(#s6)"><text xml:space="preserve" x="22" y="222.0" font-size="14" fill="#d2ff00">Quando uma rotina é repetitiva demais para ocupar uma pessoa, eu escrevo um robô.</text></g><rect x="711" y="208" width="8" height="16" fill="#e6edf3" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite" begin="1.50s"/></rect></svg>